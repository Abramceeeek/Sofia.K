# Render Blueprint: the anonymous swipe calibration page (D70) and the Brain's app API (D109). Free tier only: £0.
# How to deploy: brain/README.md → "Swipe calibration page" and "The app's Brain on Render".
#
# D109: Render allows only ONE free Postgres per workspace (render.com/docs/free, read 2026-09-29), so the Brain
# shares the swipe page's database (its tables have different names). That database was created on 27 Sep and
# expires about 27 Oct: enough for Abram's own build and the friends' round. Before strangers, it moves to a paid
# database (a money decision for Abram).
#
# Free-tier facts (render.com/docs/free, fetched 2026-09-26):
# - the web service sleeps after 15 min without visits; the next visit waits about a minute;
# - the free Postgres database expires 30 days after it is created (14 days' grace to upgrade),
#   so download the answers from /results before then.
# `plan: free` is set on both on purpose: if it is left out, Render picks paid plans.
services:
  - type: web
    name: london-places-swipe
    runtime: python
    plan: free
    region: frankfurt          # nearest Render region to London (no UK region); EU data location
    rootDir: brain
    buildCommand: pip install -r requirements-calibration.txt
    # --no-access-log: no request lines (and so no client addresses) in our logs
    startCommand: uvicorn brain.calibration:app --app-dir src --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"       # must be fully qualified
      - key: CALIBRATION_DATABASE_URL
        fromDatabase:
          name: london-places-swipe-db
          property: connectionString
      - key: CALIBRATION_ADMIN_TOKEN
        generateValue: true    # read it in the dashboard; it unlocks /results
      - key: CALIBRATION_CONTACT
        sync: false            # Render asks for it: the email shown in the page's privacy note

  - type: web
    name: moments-brain
    runtime: python
    plan: free                 # sleeps after 15 min idle; the app waits up to ~1 min for it to wake (D109)
    region: frankfurt
    rootDir: brain
    buildCommand: pip install -r requirements-app.txt
    startCommand: uvicorn brain.api:app --app-dir src --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: BRAIN_DATABASE_URL
        fromDatabase:
          name: london-places-swipe-db
          property: connectionString
      - key: BRAIN_ADMIN_TOKEN
        generateValue: true    # Abram's only; unlocks /v1/admin (safety alerts, export). Never shared
      - key: BRAIN_PLANNER_TIME_LIMIT_S
        value: "1.0"
      - key: BRAIN_ALERT_WEBHOOK_URL
        sync: false            # D118: where safety alerts are posted ({"text": ...}), e.g. a Slack incoming webhook
                               # that Abram and the backup helper both see on their phones. Never committed here
      - key: DUFFEL_ACCESS_TOKEN
        sync: false            # D120: flight search. A test token (duffel_test_…) gives Duffel's test results;
                               # left empty, trips show clearly labelled sample flights. Never committed or chatted
      - key: LITEAPI_KEY
        sync: false            # D120: stays search (LiteAPI sandbox or live key). Empty = labelled sample stays
      # Stage 1, added by hand in the dashboard (Environment), never committed or chatted. /v1/health says whether
      # each was found, never its value (brain/README.md, "Stage 1 keys"):
      # - TfL journey times: TFL_APP_KEY (also read: TFL_API_KEY, TFL_KEY, TFL_PRIMARY_KEY)
      # - Met Office forecast: MET_OFFICE_API_KEY (also read: MET_OFFICE_KEY, METOFFICE_API_KEY, MET_API_KEY,
      #   MET_OFFICE_DATAHUB_KEY)
      # - Nightly backup: BRAIN_BACKUP_PUBLIC_KEY and BRAIN_BACKUP_TOKEN, both printed by
      #   `python -m brain.backup keygen` on Abram's computer; the token also goes into GitHub Secrets
      # - Error alerts (optional): BRAIN_OPS_WEBHOOK_URL; unset, they go to BRAIN_ALERT_WEBHOOK_URL, marked
      #   "not a safety alert"

databases:
  - name: london-places-swipe-db
    plan: free
    region: frankfurt
    ipAllowList: []            # no connections from the internet; only the web service above
