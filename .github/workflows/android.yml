# ODYS for Android (D125): builds the APK on Linux and publishes it as a download.
#
# - Every push that changes android/ builds a signed debug APK (android/app/debug.keystore: debug only, so each new
#   APK installs over the last one and keeps the app's data). A Google Play release key goes in GitHub Secrets later.
# - The APK goes to the run's artifacts, and to the pre-release "android-latest" (replaced each build), so it can be
#   downloaded straight from a phone: github.com/<owner>/<repo>/releases/tag/android-latest.
name: android

on:
  push:
    paths:
      - "android/**"
      - "!android/**/*.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Audit (SEC-17, Abram, 12 Nov 2026): every run reads only. The write permission belongs to the publish job alone,
# which runs only on main, so a branch build can never touch the testers' download.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-34-36

      # Every screen drawn with the iPhone app's sample data (app/src/test/.../ScreensTest.kt): a screen that crashes
      # stops the build here, so it never reaches a phone. The pictures are kept with the run.
      - name: Draw every screen
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: ODYS-android-screens-${{ github.run_number }}
          path: android/app/build/screens
          if-no-files-found: ignore

      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ODYS-android-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ODYS-android-${{ github.run_number }}
          path: android/ODYS-android-${{ github.run_number }}.apk
          if-no-files-found: error

  # m196: only main replaces the testers' download; a branch build stays a run artifact (the friends' round needs one
  # fixed version, and a branch push once published build 18). SEC-17: in its own job, the only one that can write,
  # with no checkout: it takes the APK the build job made and nothing else.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # to publish the "android-latest" pre-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ODYS-android-${{ github.run_number }}

      - name: Publish the download (pre-release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "ODYS-android-${{ github.run_number }}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "ODYS for Android (build ${{ github.run_number }})" \
            --notes "Test build ${{ github.run_number }} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). On the phone: download the .apk, open it, and allow installs from your browser if Android asks. A newer build installs over this one and keeps your answers."
