# Backend (Brain) tests on Linux (D64). Runs only when the Brain, or the files its tests read
# (validation files, the Render blueprint), change. The iOS build runs separately in ios.yml (D70).
name: brain-tests

on:
  push:
    paths:
      - "brain/**"
      - "validation/results-sheet.xlsx"
      - "validation/conjoint/design.csv"
      - "render.yaml"
      - ".github/workflows/brain-tests.yml"
  pull_request:
    paths:
      - "brain/**"
      - "validation/results-sheet.xlsx"
      - "validation/conjoint/design.csv"
      - "render.yaml"
      - ".github/workflows/brain-tests.yml"

# Audit, 11 Nov 2026 (decisions/security-audit.md, SEC-17): this job only reads the code, so its token can only read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # SEC-21 (audit, Abram, 12 Nov 2026): the same tests on Postgres 18, as production runs. Postgres differs where it
  # matters here (text longer than a column is an error; no infinity in JSON). The fixture empties the database first.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BRAIN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" "psycopg[binary]==3.3.6"
      - run: python -m pytest -q
