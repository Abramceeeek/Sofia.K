# Roadmap Stage 1, step 5: a check every 6 hours that the Brain answers, and a nightly sealed backup.
# The repository is private, so each run uses Actions minutes (about 1 minute each): 4 checks and 1 backup a day
# is about 150 minutes a month of the 2,000 included (an hourly check alone would use about 744).
#
# - Uptime: GET /v1/health every 6 hours. If it doesn't answer (after one retry, allowing for the free server's ~1 minute
#   wake), the job fails: GitHub emails whoever added this workflow (docs.github.com, "Notifications for workflow
#   runs", read 19 Oct 2026), and, if the BRAIN_OPS_WEBHOOK_URL secret is set, a message goes there too. A provider
#   that is set but failing (the Met Office, TfL) shows as a warning on the run, not a failure.
# - Backup: GET /v1/admin/backup each night with the BRAIN_BACKUP_TOKEN secret. The Brain seals it to Abram's public
#   key before it leaves (brain/src/brain/backup.py), so GitHub only ever holds ciphertext. Kept as
#   a workflow artifact for 30 days. Without the secret, the job says so and stops.
# Secrets are read from GitHub Secrets only; none is ever printed.
name: ops

on:
  schedule:
    - cron: "7 */6 * * *"    # uptime: every 6 hours at :07
    - cron: "23 2 * * *"     # backup: 02:23 UTC, about 3 am in London
  workflow_dispatch:
    inputs:
      job:
        description: "Which check to run now"
        type: choice
        options: [uptime, backup]
        default: uptime

permissions:
  contents: read

env:
  BRAIN: https://moments-brain.onrender.com

jobs:
  uptime:
    if: (github.event_name == 'schedule' && github.event.schedule == '7 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'uptime')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask the Brain if it's up
        run: |
          body=""
          for try in 1 2; do
            if body=$(curl -fsS --max-time 100 "$BRAIN/v1/health"); then break; fi
            body=""; sleep 20
          done
          if [ -z "$body" ]; then
            echo "::error::The Brain didn't answer at $BRAIN/v1/health (twice, 100 s each)."
            exit 1
          fi
          echo "$body"
          python3 - "$body" <<'EOF'
          import json, sys
          h = json.loads(sys.argv[1])
          if not h.get("ok"):
              print("::error::/v1/health answered, but not ok")
              sys.exit(1)
          if h.get("weather") == "met_office_error":
              print("::warning::The Met Office key is set, but its last call failed: plans go ahead without the forecast.")
          travel = str(h.get("travel", ""))
          if travel == "tfl_error":
              print("::warning::TfL refused the first calls (is TFL_APP_KEY right?): plans use the estimate.")
          elif travel.startswith("tfl_filling"):
              print(f"::notice::TfL's journey times are still filling: {travel}")
          for k in ("flights", "stays"):
              if h.get(k) == "sample":
                  print(f"::notice::{k}: sample results (no provider key in Render).")
          EOF
      - name: Tell a person
        if: failure()
        env:
          HOOK: ${{ secrets.BRAIN_OPS_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No BRAIN_OPS_WEBHOOK_URL secret: GitHub's own email only."; exit 0; fi
          curl -fsS --max-time 20 -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"ODYS Brain isn't answering (not a safety alert): $BRAIN/v1/health failed at $(date -u +%H:%M) UTC. Render dashboard, moments-brain, Logs.\"}" \
            "$HOOK" > /dev/null

  backup:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'backup')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch tonight's sealed backup
        id: fetch
        env:
          TOKEN: ${{ secrets.BRAIN_BACKUP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No BRAIN_BACKUP_TOKEN secret yet, so no backup was made (brain/README.md, Backups)."
            exit 0
          fi
          mkdir -p out
          f="out/odys-brain-$(date -u +%Y%m%d).odysbk"
          code=$(curl -sS --max-time 150 --retry 1 --retry-delay 20 -H "Authorization: Bearer $TOKEN" \
                 -o "$f" -w "%{http_code}" "$BRAIN/v1/admin/backup") || true
          if [ "$code" != "200" ]; then
            echo "::error::The backup request answered $code."
            [ -f "$f" ] && head -c 300 "$f" | tr -cd '[:print:]\n' && echo
            rm -f "$f"
            exit 1
          fi
          if [ "$(head -c 8 "$f" | head -n 1)" != "ODYSBK1" ]; then
            echo "::error::The file isn't a sealed ODYS backup, so it isn't kept."
            rm -f "$f"
            exit 1
          fi
          ls -l out
          echo "made=yes" >> "$GITHUB_OUTPUT"
      - name: Keep it for 30 days
        if: steps.fetch.outputs.made == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: odys-brain-backup-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
      - name: Tell a person
        if: failure()
        env:
          HOOK: ${{ secrets.BRAIN_OPS_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then exit 0; fi
          curl -fsS --max-time 20 -X POST -H "Content-Type: application/json" \
            -d '{"text": "ODYS Brain: last night'"'"'s backup failed (not a safety alert). GitHub, Actions, ops."}' \
            "$HOOK" > /dev/null
