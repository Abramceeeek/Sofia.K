# m357 (Abram, 25 Nov: "Android debug APK for your own testing"): the QA app (com.odys.app.qa, versioned "-qa"),
# installed beside the real one, pointed at the QA Brain. A debug-signed APK, kept as this run's artifact for 7 days
# for Abram's own phone. The repository is public, so any signed-in GitHub user could download it: it holds no
# secrets and reaches only the QA Brain, which holds no real travellers' data.
name: android-qa

on:
  # also when this file changes, so a branch can prove the QA build works (GitHub runs a manual-only workflow
  # only once it's on the default branch)
  push:
    paths:
      - ".github/workflows/android-qa.yml"
  workflow_dispatch:
    inputs:
      brain_url:
        description: "The QA Brain's address"
        required: true
        default: "https://odys-brain-qa.onrender.com"

permissions:
  contents: read

jobs:
  qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - name: Check the Brain is QA's
        env:
          BRAIN_URL: ${{ inputs.brain_url || 'https://odys-brain-qa.onrender.com' }}
        run: |
          case "$BRAIN_URL" in https://*) ;; *) echo "::error::The QA Brain must be https"; exit 1;; esac
          [ "$BRAIN_URL" != "https://moments-brain.onrender.com" ] || { echo "::error::That's the production Brain"; exit 1; }
      - name: Build the QA APK
        env:
          BRAIN_URL: ${{ inputs.brain_url || 'https://odys-brain-qa.onrender.com' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleQa -PqaBrainUrl="$BRAIN_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ODYS-QA-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/qa/*.apk
          retention-days: 7
