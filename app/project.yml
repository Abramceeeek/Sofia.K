# XcodeGen spec for the iOS app (the Face). CI runs `xcodegen generate` to make Face.xcodeproj,
# so no Xcode project files are committed and no Mac is needed (D64).
#
# STATUS: Build 1 in progress (D109, app first): the real screens (design/v0-screens.md). The bundle ID, team and
# signing come from the provisioning profile in GitHub Secrets at build time (.github/workflows/ios.yml), so none
# are hard-coded here.
name: Face
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"        # CI sets it to the workflow run number
    SWIFT_VERSION: "5.0"
targets:
  Face:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist                  # generated; git-ignored
      properties:
        CFBundleDisplayName: ODYS       # D119: the name under the icon (was "Days out")
        UIUserInterfaceStyle: Dark      # D119: dark always, system sheets included
        BrainBaseURL: https://moments-brain.onrender.com   # the Brain on Render (render.yaml); confirm after deploy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false   # no custom encryption, so no export-compliance question per build
        UIAppFonts: [Newsreader.ttf, NewsreaderItalic.ttf]   # D112, D119: serif and italic (SIL Open Font License 1.1, Sources/Fonts)
        # D115: "Tell it instead" (screen 4): speech becomes text on the phone; the sound is never saved or sent
        NSMicrophoneUsageDescription: "Only when you tap Tell it instead: your phone turns what you say into text. The sound is never saved or sent."
        NSSpeechRecognitionUsageDescription: "Your phone turns what you say into text, on the phone itself. Only the text is sent, as if you'd typed it."
        # D123: location while you're out, on the phone only (never in the background)
        NSLocationWhenInUseUsageDescription: "While you're out, ODYS shows how far your next stop is and notices when you've arrived and left, so it can ask how it felt. Your location stays on your phone, unless you choose to start a plan from where you are."
        CFBundleURLTypes:                      # D114: share links open the app as daysout://r/<code>
          - CFBundleURLName: daysout.share
            CFBundleURLSchemes: [daysout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.face.placeholder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only for v0
    scheme: {}
