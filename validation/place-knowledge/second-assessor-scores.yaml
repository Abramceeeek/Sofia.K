# Second assessor, blind (28 Nov 2026). Read only place-vocabulary.md, evidence-rules.md, blind_input.yaml.
# Convention used for 0 versus unknown (the rubric leaves this open, see notes):
# - Every experience has an official content claim and an hours claim, so dimensions about what the
#   experience consists of (history, culture, art, science, nature, views, food_discovery, dining,
#   shopping, nightlife, play, adventure) are scored 0 unless a claim evidences them.
# - architecture, learning and social are not implied by a description of contents, so they stay
#   unknown unless a claim speaks to the structure, the format of explanation, or company.
# - Inferred claims may support a 1 (vocabulary §4 lets inferred-at-most terms score 1), never a 2 or a primary.

