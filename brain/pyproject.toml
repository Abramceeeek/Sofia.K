[project]
name = "brain"
version = "0.1.0"
description = "Backend for the moment-based day planner: moment database, personal scoring and the OR-Tools planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "ortools>=9.10",
    "numpy>=2.0",
    "pyyaml>=6",
    "openpyxl>=3.1",   # reads the Phase 3 results sheet (Test B)
    "reportlab>=4.0",  # Test B plans as PDFs
    "httpx>=0.27",     # D120: flight and stay providers
    "cryptography>=44", # Stage 1: nightly backups, encrypted to Abram's public key (backup.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
