# The 16 Test A swipe items (validation/interview-script.md §3), keyed by the "Item #" column
# of the results sheet's Swipes tab.
#
# STATUS: LOCKED 28 Sep (D107). These 16 are the provisional list; the swipe-page results (D70c) are no longer
# waited for. Never change the items mid-test.
# D110 (Build 1 feedback): the app shows the 10 in `app_items`, chosen by `python -m brain.swipeinfo` to keep the
# most information about the ready cards (V-optimal design; 10 keep about 85% of what 16 give). Item numbers stay the
# same, so all 16 remain valid answers. If most people answer "Haven't been" to 15 or 10, Hyde Park (6) is the
# swap-in (it costs 1-2% of the information).
# The tags are Claude's first draft from each name (Area 2 process: the LLM drafts, Abram corrects).
# They are judgements, not facts. Cost is left out (null) until prices are checked, so swipes do
# not inform the cost weight.
#
# Tags are 0-2. Place: movement_views, food, green_nature, history_culture, iconic, local_novel,
# crowds, walking_effort, active, outdoor_exposure, photo_potential.
# Moment: contrast_reveal, absorption, awe, social_pull.
#
# `cards` (D100): the moment cards at the same place. A place the person loved can come back as the plan's one
# familiar favourite (testb --familiar); cards at a place they didn't enjoy are never planned for them.

