# m235 (WS1, Global Destination Intelligence): what the London moment cards need to become structured experiences
# (brain/src/brain/catalogue.py). The cards stay the source of their own facts (place, hours, price, the way in,
# tags, checked dates); this file adds only what they don't say: a category and a type from ODYS's taxonomy
# (catalogue.TAXONOMY), and an area where the card's own title or place name names one. Everything else is derived
# from the card and said where it came from.
#
# Category and type: Claude's assignment (10 Nov 2026), for Abram to check. Area: only from the card's own words;
# otherwise left out (unknown), never guessed from the coordinates.
# m337 (24 Nov): `short` is the name a day's title uses where the card's place name reads badly cut short ("Greenwich
# Park" for the General Wolfe statue); Claude's wording, for Abram to check. Without it, the title takes the place
# name before its first comma or colon.
