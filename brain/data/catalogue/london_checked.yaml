# m245 (destination quality, WS1): facts read from each London place's OFFICIAL site on 11 Nov 2026 (Claude, by
# web fetch), layered over the cards by catalogue.load_catalogue. Only what a page itself said: a quote or its exact
# wording, and its URL. Nothing is inferred:
# - step_free is "yes", "partial" or "no" only where the page says so; a page that lists features (a ramp, a hoist)
#   without saying the visit is step-free is "partial"; a page that says nothing leaves it unknown, never "no";
# - an area is recorded only where the official page itself names it;
# - hours are the page's own words; conflicting pages, seasonal or "dusk" hours stay text (no weekly table);
# - a price is recorded where the page states one; where the card differs, the card is listed under card_differs
#   for Abram (the planner still reads the cards: nothing in a plan changes until he agrees);
# - notices are dated things the page announced (closures, seasonal changes, events that change the visit).
# not_read: pages that refused (403), failed (404, 503, header overflow) or hid the answer (collapsed text). They are
# never filled from another source.
checked: "2026-11-11"
