# Candidate places for the anonymous swipe calibration page (D70). The page asks strangers
# Loved it / It was fine / Didn't enjoy it / Haven't been for each, and the results pick the 16
# most familiar-and-divisive for the Test A swipe step and v0 onboarding.
#
# `swipe_item` links a candidate to the current draft list (data/swipe_items.yaml); a test checks
# that its tags match that file. The other 14 are new candidates.
#
# STATUS: DRAFT. Tags are Claude's first draft from each name (the LLM drafts, Abram corrects).
# They are judgements, not facts, and are used here only to check that the chosen 16 cover every
# taste feature. `line` is what people see under the name: plain, neutral, no praise.
#
# Tags are 0-2. Place: movement_views, food, green_nature, history_culture, iconic, local_novel,
# crowds, walking_effort, active, outdoor_exposure, photo_potential.
# Moment: contrast_reveal, absorption, awe, social_pull.

