# Onboarding content served to the app. Wording follows validation/interview-script.md (Test A).
# The swipe places are the app's 10 of the 16 locked items in swipe_items.yaml (D107, D110), served as `swipe_places`;
# the "this or that" tasks come from conjoint_design.csv (a copy of validation/conjoint/design.csv).
# D110 (Build 1 feedback): the first plan comes after best hour, why, places and this-or-that; `about_you` and
# `photos` move to an optional "Improve my plans" step after it.
version: "0.1"
open_questions:
  - key: best_hour
    title: "A great moment"   # D112: was "The best hour"; the key stays best_hour
    text: "Tell us about a great moment from a recent day out. Where were you, what was happening, how did it feel?"
    follow_up: "Is there anything else you'd like to add about that?"
    # D110: short examples, so people know what kind of answer helps; the question can be skipped
    examples:
      - "Sitting on the top deck of a bus over Waterloo Bridge at dusk. Tired, but happy."
      - "Eating street food by the river with friends. No plan, lots of laughing."
      - "Swimming in a cold lake, then a hot drink. I felt completely awake."
based:   # D116: the first question. "abroad" gets the category cards instead of the London places (a separate cohort)
  prompt: "Where are you based?"
  options: [london, uk, abroad]
  city_prompt: "Which town or city? (optional)"
  note: "So we ask the right questions. We never ask your nationality."
why_travel:   # D115: feelings, each mapped onto existing features in brain/reasons.py (FEELINGS) and used in the fit
  prompt: "How do you most want to feel on a day out? Pick one or two."   # D118: "None of these" is a link below
  options: [restored, excited, connected, curious, peaceful]
swipe:
  prompt: "Have you been? How did it feel?"
  reactions: [loved, fine, didnt_enjoy, havent_been, skip]   # skip: "Not sure" (D110)
conjoint:
  prompt: "Which day sounds more like you? There are no wrong answers."   # D117 (D115, D112: labelled as made up)
  option_label: "Example day"   # "Example day A" / "Example day B"
  no_preference: "No preference"   # D110: stored, left out of the fit
  # D112: 5 before the first plan, 5 in "Improve future plans", chosen with the upfront places by expected regret
  upfront: [2, 4, 6, 8, 9]
  later: [1, 3, 5, 7, 10]
# D117: before the first plan, from the person's answers only (brain/summary.py). No scores. "Change something" lets
# them mark an item "not right": it's stored, and that answer stops counting
summary:
  title: "So far, I've learned…"
  note: "From your answers only. Nothing here is a score."
  empty: "You skipped the questions, which is fine. Your first plan starts from what most people enjoy, and it learns from how you rate each stop."
  change_note: "Tap anything that isn't right. We'll stop using that answer."
# Build 2: the in-app Test B pair (screens 18-19, validation/test-plan.md). London and UK people only; visitors
# from abroad skip it (D116). Both plans are shown in the same text format, with nothing about why a stop was chosen
testb:
  intent_title: "Before your plans"
  mood_prompt: "Recharge or explore?"
  company_prompt: "Who might come?"
  wish_prompt: "Anything you'd want in it for sure? (optional)"
  intro: "Two plans for the same Saturday afternoon, made in different ways. Which would you rather do?"
  choose_prompt: "Which would you rather do? Go with your gut."
  fit_prompt: "This plan fits me"
  fit_scale: "1 (not at all) - 5 (completely)"
  why_prompt: "Why? (optional)"
  reveal_personal: "Plan {personal} was made from your answers. Plan {other} is a strong general day out in London, the kind a friend or a search would suggest."
  reveal_kept: "Your plan is Plan {chosen}, the one you picked. Rate each stop after you've been."
# Build 2, screen 16: the Test A survey (validation/interview-script.md §8), after the pair
survey:
  title: "Three quick questions"
  understood: "I felt understood."
  like_person: "It felt like talking to a person, not filling in a form."
  scale: "1 (not at all) - 5 (completely)"
  typed_or_spoke: "Did you type or speak your answers?"
  intrusive: "Was anything intrusive or tedious? (optional)"
about_you:
  - {key: budget_band, text: "Roughly what do you like to spend on a day out, per person?"}
  - {key: company, text: "Who do you usually go with?"}
  - {key: chronotype, text: "Morning person or night person?"}
  - {key: activity, text: "How active do you like a day to be?"}
  - {key: grew_up, text: "What kind of place did you grow up in?", note: "Optional. Only used to guess what will feel new to you."}
  - {key: foods_avoided, text: "Any foods or drinks you avoid?", note: "Optional. Only used to choose food stops, and you can skip it."}
# D110: two separate questions; the example shot card sits with the second, labelled as an example, and isn't shown again
photos:
  - {key: photos_matter, text: "How much do photos and sharing matter on your trips?", scale: "1 (not at all) - 5 (a lot)"}
  - {key: shot_card_appeal, text: "Some stops come with a shot card: where to stand for the best photo. Would that make you more likely to go?", scale: "1 (no) - 5 (definitely)", example_label: "Example of what you'll get"}
