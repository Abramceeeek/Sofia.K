# Sources (search and ianVisits, read 2026-09-28): Alderman Stairs is a narrow passage just east of the Tower, between
# Millers Wharf (78 St Katharine's Way, E1W 1UE) and Tower View, leading down to the river through an unlocked gate.
# Next to it, a signposted Thames Path turn leads between the buildings to a raised terrace with a view back up the
# river to Tower Bridge and across to Butler's Wharf. Tower Hill and Tower Gateway are about 0.6 miles away.
# SAFETY: the stairs go down to the tidal foreshore. The card keeps you on the terrace, not on the foreshore.
