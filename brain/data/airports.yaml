# D120: airports and city codes for "Flying from" (trips). Standard IATA codes, from Claude's own knowledge; when a
# Duffel token is set, Duffel's place suggestions are used as well, and they are the authority.
# `region` only shapes the made-up sample flights (their rough length); it is never shown and never used for people.
# City codes (LON, PAR, NYC …) search every airport in that city.
