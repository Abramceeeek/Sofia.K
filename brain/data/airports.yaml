# Where trips can go (D120: London now; then UK cities, then Europe, then further). A destination needs flights and
# stays (any city works for those) and, for day plans, ready moment cards (London only today, after-9-Nov #38).
destinations:
  - key: london
    name: London
    country_code: GB
    airport: LON                     # all London airports
    centre: {lat: 51.507819, lon: -0.126137, name: Charing Cross}   # the Test B start point (D104)
    day_plans: true
