  # m222: France, from the Ministry of Education's open data ('Le calendrier scolaire', DNE - Ministere de l'Education
  # Nationale, Licence Ouverte v2.0 (Etalab), modified 1 Oct 2026; read 8 Nov 2026). The dataset says holidays begin
  # "apres la classe des jours indiques" and classes resume "le matin des jours indiques"; its timestamps are local
  # midnight. So a holiday here runs from the start day to the day before classes resume, inclusive. Which academies
  # are in each zone is on the ministry's page, which refused automated reading (403): not listed here.
  france_zone_a: &france_2026
    authority: "France, zone A (Ministry of Education)"
    country: FR
    region: zone-a
    source: https://data.education.gouv.fr/explore/dataset/fr-en-calendrier-scolaire/
    source_note: "Open data 'Le calendrier scolaire' (DNE - Ministère de l'Education Nationale), Licence Ouverte v2.0, modified 2026-10-01. Pupils' dates (eleves); teachers' summer ends a day earlier."
    last_verified: "2026-11-08"
    years: ["2026-27"]
    exceptions: "The data doesn't say which kinds of schools follow it. Holidays begin after class on the first day shown (the data's own definition)."
    holidays:
      - {title: "Vacances de la Toussaint", from: 2026-10-17, to: 2026-11-01}
      - {title: "Vacances de Noël", from: 2026-12-19, to: 2027-01-03}
      - {title: "Vacances d'hiver", from: 2027-02-13, to: 2027-02-28}
      - {title: "Vacances de printemps", from: 2027-04-10, to: 2027-04-25}
      - {title: "Vacances d'été", from: 2027-07-03, to: 2027-09-01}
    not_included: "The Ascension bridge (pont de l'Ascension): the data gives the same start and end time, so it isn't added until read on the ministry's page."
  france_zone_b:
    <<: *france_2026
    authority: "France, zone B (Ministry of Education)"
    region: zone-b
    holidays:
      - {title: "Vacances de la Toussaint", from: 2026-10-17, to: 2026-11-01}
      - {title: "Vacances de Noël", from: 2026-12-19, to: 2027-01-03}
      - {title: "Vacances d'hiver", from: 2027-02-20, to: 2027-03-07}
      - {title: "Vacances de printemps", from: 2027-04-17, to: 2027-05-02}
      - {title: "Vacances d'été", from: 2027-07-03, to: 2027-09-01}
