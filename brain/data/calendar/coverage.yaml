  - {country: GB, nation: England, level: council, name: "Kent County Council", status: blocked, last_tried: "2026-11-09", note: "403: a Cloudflare bot challenge; its schools site (kelsi.org.uk) refused by this environment. To read by hand"}
  - {country: GB, nation: England, level: council, name: "Hampshire County Council", status: blocked, last_tried: "2026-11-09", note: "403: a captcha on the whole site, documents host included. To read by hand"}
