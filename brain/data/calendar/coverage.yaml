# m222: which school-holiday jurisdictions ODYS has checked, and which it hasn't. Two councils are never "UK-wide"
# (Abram, 7 Nov). A row is "checked" only if its dates are in school_holidays.yaml (a test cross-checks both ways);
# "blocked" means the official page refused automated reading; "not checked" means not tried yet. Bank holidays are a
# separate kind of data (GOV.UK's file, m204) and aren't counted here.
#
# status: checked | blocked | not checked     level: national | region | council
rows:
  # ---- Wales: one Welsh Government table for all 22 councils (gov.wales, 2026-27, last updated 16 Jul 2025)
  - {country: GB, nation: Wales, level: council, name: "All 22 Welsh councils (21 share dates; Powys differs)", status: checked, years: "2026-27", areas: [cardiff, anglesey, blaenau_gwent, bridgend, caerphilly, carmarthenshire, ceredigion, conwy, denbighshire, flintshire, gwynedd, merthyr_tydfil, monmouthshire, neath_port_talbot, newport, pembrokeshire, rhondda_cynon_taf, swansea, torfaen, vale_of_glamorgan, wrexham, powys], last_verified: "2026-11-08", note: "Summer 2027's end is in the 2027-28 table, not published yet (404 on 8 Nov 2026)."}
  # ---- Scotland: each of 32 councils sets its own
  - {country: GB, nation: Scotland, level: council, name: "City of Edinburgh Council", status: checked, years: "2026-27", areas: [edinburgh], last_verified: "2026-11-07"}
  - {country: GB, nation: Scotland, level: council, name: "The other 31 Scottish councils", status: not checked, note: "Each council's own page, one at a time."}
  # ---- Northern Ireland: the Department of Education's non-operational dates (schools can differ)
  - {country: GB, nation: Northern Ireland, level: national, name: "Department of Education (NI) non-operational dates", status: checked, years: "2026-27", areas: [northern_ireland], last_verified: "2026-11-08", note: "Schools can operate on these dates at their own discretion."}
  # ---- England: each council sets dates for its community schools; academies and others can set their own
  - {country: GB, nation: England, level: council, name: "London Borough of Camden", status: blocked, last_tried: "2026-11-09", note: "403: a Cloudflare bot challenge on the whole site. To read by hand"}
  - {country: GB, nation: England, level: council, name: "Manchester City Council", status: blocked, last_tried: "2026-11-09", note: "403: a Cloudflare bot challenge on the whole site. To read by hand"}
  - {country: GB, nation: England, level: council, name: "Westminster City Council (bi-borough with Kensington and Chelsea)", status: checked, years: "2026-27", areas: [westminster], last_verified: "2026-11-09", note: "Recommended dates; schools may vary them. Kensington and Chelsea shares the PDF but isn't added from Westminster's page"}
