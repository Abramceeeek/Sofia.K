# Aspiration match (D77): one optional Test A question, mapped onto moments.
#
# A person who picks a field gets `aspiration_match = 1` on every moment of that field (priors.yaml).
# A field maps to existing tags where one fits: `tags: {food: 2}` means the moment's food tag is at least 2
# (the defining trait, not a side note). Finance & tech and art & design have no existing tag, so their
# moments are listed by id. `python -m brain.testb fields` flags any field with fewer than
# `min_ready_moments` checked (status: ready) moments.

question: "Which of these fields inspire you? Pick any, or none."
note: "Optional. We only use it to add places tied to what inspires you."
min_ready_moments: 2
fields:
  finance_tech:
    label: "Finance & tech"
    tags: {}
    moments: [m_canary_wharf_towers, m_city_towers_walk]   # no existing tag: listed by id
  food:
    label: "Food"
    tags: {food: 2}
  history_culture:
    label: "History & culture"
    tags: {history_culture: 2}
  nature:
    label: "Nature"
    tags: {green_nature: 2}
  art_design:
    label: "Art & design"
    tags: {}
    moments: []                                            # none yet (see the coverage check)
  none:
    label: "None of these"
