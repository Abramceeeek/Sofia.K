# Aspiration match (D77): one optional Test A question, mapped onto moments.
#
# A person who picks a field gets `aspiration_match = 1` on every moment of that field (priors.yaml).
# A field maps to existing tags where one fits: `tags: {food: 2}` means the moment's food tag is at least 2
# (the defining trait, not a side note). Finance & tech has no existing tag, so its moments are listed by id.
# Art & design was dropped from the Test B question (D83) and waits on decisions/after-9-nov.md.
# `python -m brain.testb fields` flags any field with fewer than `min_ready_moments` checked
# (status: ready) moments.

# D110: plain words in the app. Test A's hand-run wording (validation/interview-script.md 5.7) is paused with it.
question: "What interests you most? Pick any, or none."
note: "We ask so we can add a place tied to what interests you. Optional."
min_ready_moments: 2
fields:
  finance_tech:
    label: "Finance & tech"
    tags: {}
    moments: [m_canary_wharf_towers, m_city_towers_walk,   # no existing tag: listed by id
              m_bank_of_england_gold, m_garden_at_120, m_horizon_22,   # research picks (D89)
              a_kings_cross_canal]   # D93
  food:
    label: "Food"
    tags: {food: 2}
  history_culture:
    label: "History & culture"
    tags: {history_culture: 2}
  nature:
    label: "Nature"
    tags: {green_nature: 2}
  none:
    label: "None of these"
