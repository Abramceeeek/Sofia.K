# Population model for v0: b_population, plus the prior on each person's deviation δ_person.
#
# Status: GUESS unless `source` says otherwise. The offline hierarchical refit (Area 3)
# replaces these numbers once Phase 3 data exist. Nothing here is estimated from data yet.
#
# Coding: place and moment tags are 0-2 in the moment record and enter the model as tag/2 (0-1).
# `personal: true` means the feature gets its own δ for each person; the rest stay at the
# population level (interactions cannot be identified per person from 10 choices, Area 3).

version: "0.2"   # m134, m135: swipe cutpoints fitted from the swipe page, and a personal swiping level

# Source-specific scale (Train §7.2): stated choices, swipes and ratings share the same βs
# but differ in the variance of unobserved utility.
scales:
  conjoint: 1.0
  swipe: 1.0
  rating: 1.0

# Ordered-logit thresholds on the latent utility, held fixed in the per-person update.
cutpoints:
  # m134: fitted by `python -m brain.swipecal` on the swipe page (12 people, 235 answers, 27-28 Sep; se 0.72 and 0.60).
  # The GUESS [-1, 1] implied 33% "didn't enjoy"; people answered 4% didn't / 41% fine / 55% loved.
  swipe: [-5.15, -0.67]              # didn't enjoy | it was fine | loved it
  # D115: one dimension, worded Disappointing (1) | Fine (2) | Good (3) | Great (4) | Unforgettable (5). GUESS cutpoints, symmetric.
  # The planner's floor is the 2|3 cut (-0.75): a stop goes into a plan only if it's predicted "Good" or better.
  rating: [-2.0, -0.75, 0.75, 2.0]   # Disappointing | Fine | Good | Great | Unforgettable

features:
  # Place tags (Area 2)
  - {name: movement_views,   label: "movement and views",          group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: food,             label: "food",                        group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: green_nature,     label: "green spaces and nature",     group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: history_culture,  label: "history and culture",         group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: iconic,           label: "famous sights",               group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: local_novel,      label: "local, new-to-you places",    group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: crowds,           label: "crowds",                      group: place,  mean: -0.4,  delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior"}
  - {name: walking_effort,   label: "walking effort",              group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: active,           label: "being active",                group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: outdoor_exposure, label: "being outdoors",              group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: photo_potential,  label: "photo spots",                 group: place,  mean: 0.0,   delta_sd: 0.75, personal: true}
  # Moment tags (D9)
  - {name: contrast_reveal,  label: "reveals and contrast",        group: moment, mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: absorption,       label: "absorbing activities",        group: moment, mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: awe,              label: "awe",                         group: moment, mean: 0.0,   delta_sd: 0.75, personal: true}
  - {name: social_pull,      label: "places to bring people",      group: moment, mean: 0.0,   delta_sd: 0.75, personal: true}
  # Cost and conditions
  # D88: the cost weight is sign-constrained. It is fitted on a log scale, β = -0.25 · e^δ with δ ~ N(0, 0.8²):
  # median -0.25, 95% of people between about -0.05 and -1.2 per £10 (GUESS, matched to the old N(-0.25, 0.5²)'s
  # negative range). It can't turn positive, so "worth about £V to you" (scoring.value_gbp) stays finite.
  - {name: cost_per_10gbp,   label: "cost (per £10)",              group: cost,   mean: -0.25, delta_sd: 0.8,  personal: true, scale: log, source: "validation/conjoint/README.md prior; log scale D88"}
  - {name: hot_outdoor,      label: "heat outdoors (28°C+)",       group: weather, mean: -0.5, delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior"}
  # D95: rain and cold are conjoint levels now ("weather at the outdoor stops"), so both are personal.
  - {name: rain_outdoor,     label: "rain outdoors",               group: weather, mean: -1.0, delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior (D95)"}
  - {name: cold_outdoor,     label: "cold outdoors (8°C or below)", group: weather, mean: -0.5, delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior (D95); GUESS"}
  - {name: heat_walking,     label: "walking in the heat",         group: weather, mean: -0.5, delta_sd: 0.0,  personal: false}
  # Legs and whole-day shape (the conjoint attributes)
  - {name: transfer_15_30,   label: "transfers of 15-30 min",      group: leg,    mean: -0.3,  delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior (30 vs 15 min)"}
  - {name: transfer_30_plus, label: "transfers over 30 min",       group: leg,    mean: -0.7,  delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior (50 vs 15 min = -1.0 in total)"}
  - {name: packed_pace,      label: "a packed day (5 stops, not 3)", group: day,  mean: 0.0,   delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior"}
  - {name: long_walk,        label: "long walking days (8 km, not 3)", group: day, mean: 0.0,  delta_sd: 0.75, personal: true, source: "validation/conjoint/README.md prior"}
  # Person x moment (D77): 1 when the moment belongs to a field the person said inspires them
  # (data/aspiration.yaml). GUESS: +0.5 is about a third of one rating step; swipes can move it.
  # D97: starting weight lowered from +0.5 to +0.25 after the Test B dry run, so swipes and choices do more of the work
  - {name: aspiration_match, label: "places tied to a field that inspires them", group: person, mean: 0.25, delta_sd: 0.5, personal: true}
  # m135: how positively a person swipes overall (some love every place, others call every place fine). It is 1 on
  # every swipe and 0 everywhere else, so it soaks up that style without ever entering a plan's scores.
  - {name: swipe_level,      label: "how positively they swipe",   group: response, mean: 0.0, delta_sd: 1.5, personal: true, source: "brain.swipecal on the swipe page, 29 Sep: sd 1.51 (se 0.71), 12 people"}
