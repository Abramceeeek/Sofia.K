# m246 (WS2): Paris, ODYS's second controlled destination (Abram, m244). DEVELOPMENT ONLY: this file is not in
# data/destinations.yaml, so no route, trip or plan can offer Paris (tested). Paris isn't "supported" until its
# readiness checklist passes and Abram reviews the coverage (decisions/destination-readiness.md).
#
# Every fact was read on 11 Nov 2026 from the place's OFFICIAL site (or paris.fr for city-run places), by Claude
# (web fetch). Each says where it came from. Nothing is filled from memory:
# - status ready: a checked location, address and hours. A missing price or access stays unknown and is said.
# - status draft: something essential (hours, an unclear closure) couldn't be read; never recommended.
# - point: coordinates from Wikidata (CC0), or OpenStreetMap (ODbL) for Chartier, against the official address.
# - district: the arrondissement as the official page prints it ("Paris 3e"), else from the printed postcode
#   (75003 is the 3rd), marked estimated.
# - Prices that differ by nationality or residence (EEA and non-EEA) are recorded as a range. ODYS never asks
#   nationality (CLAUDE.md), so it budgets with the higher price and shows the range.
# - minutes, setting and features (the recommendation tags) are Claude's judgement (GUESS), as for London (D91).
# - No photos: none is added until each is checked one by one (Abram, m244). The cards show the map instead.
#
# Not included (official site unreadable on 11 Nov; never filled from elsewhere): Musée de l'Orangerie (403), Musée
# des Arts Forains (503), La Grande Épicerie de Paris (403), Le Marais and Île Saint-Louis walks (the tourist
# office, parisjetaime.com, 403).
