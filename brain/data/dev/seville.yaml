# m318: Seville, a DEVELOPMENT destination (Abram, 20 Nov 2026: "a trustworthy Seville Preview ... do not claim full
# Seville support"). This file is not in data/destinations.yaml or data/airports.yaml, so no route, trip or plan can
# offer Seville (tested). It is read only by tests, the coverage and benchmark scripts, and the pilot pack.
#
# Every fact was read on 20 Nov 2026 by Claude (web fetch), from the place's OFFICIAL site, the City of Seville
# (visitasevilla.es, the city tourism office; mercadosdesevilla.es, the city's markets platform linked from
# sevilla.org), the Spanish government or the operator. Each says where it came from. Nothing is filled from memory:
# - status ready: a checked location, address and hours. A missing price or access stays unknown and is said.
# - status draft: something essential couldn't be read (usually the hours); never recommended.
# - point: OpenStreetMap (ODbL, Nominatim on the official address or name) or Wikidata (CC0).
# - The city tourism office's leaflet "Monumentos de Sevilla" is dated June 2025 (file Monumentos-ES-27062025.pdf).
#   Hours taken from it carry `checked: 2025-06-27`, so they are older than the 180-day freshness bar and are never
#   shown as "confirmed open".
# - minutes, setting and features (the recommendation tags) are Claude's judgement (GUESS), as for London and Paris.
# - No photos: none is added until each is checked one by one.
# - Dietary claims are NOT data here (FoodFacet; DPIA): a venue's own words about vegetarian food are kept only as a
#   comment and in the pilot report, quoted, never as a field a plan filters or ranks on.
#
# Sundays: the four municipal markets are closed (Mon-Sat only), which matters for a visitor arriving on a Sunday.
#
# Not included or draft (never filled from elsewhere):
# - Hospital de los Venerables (hospitalvenerables.es, 503 twice), Cruceros Torre del Oro (503 twice),
#   Mercado Lonja del Barranco (lonjadelbarranco.com, 503 twice), Plaza de Toros visits (hours on another host, not
#   read), Antiquarium (no independent location found).
# - El Rinconcillo, Espacio Eslava, Bodeguitas Antonio Romero: their own sites state no opening hours (draft).
# - Torre del Oro: the Navy's page (footer 1996-2021: Tue-Fri 09:30-18:00, Sat and holidays 10:30-18:00, EUR 3, free
#   on Mondays) and the city's June 2025 leaflet (Mon-Fri 09:30-19:00, weekends 10:30-19:00, free with a EUR 3
#   donation) disagree (draft).
