# D116: category cards, the visitors' onboarding (after-9-nov #31). Shown instead of the London places only to people
# who answer "Visiting from abroad" on "Where are you based?". Londoners and the rest of the UK keep the current places.
#
# Each card is a KIND of place, with the same tags as a swipe place (0-2, place and moment features), so an answer
# enters the fit exactly like a place swipe: Love it / Fine / Not for me use the swipe cutpoints and scale (a GUESS:
# they were fitted on real places, m134). "Never tried" asks "Would you like to try it in London?": yes or no is one
# stated choice at half a this-or-that choice's weight, like the feelings (D115); "Not sure" carries nothing.
#
# `example` is a ready London card whose openly licensed photo (and credit) the app shows as "In London, for example".
# `phrase` is how the kind reads inside a sentence ("You love big museums, and this has history too.").
# Tags are Claude's judgements, not facts (as for the swipe places); Abram checks the list (D116).

version: "0.1"
prompt: "What kinds of places do you enjoy?"
note: "Wherever you're from. There are no wrong answers."
want_prompt: "Would you like to try it in London?"
items:
  big_museums:
    title: "Big museums with famous collections"
    line: "Treasures from around the world, under one roof."
    phrase: "big museums"
    example: m_bm_great_court
